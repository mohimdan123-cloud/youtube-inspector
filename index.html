<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F1218">
<meta name="color-scheme" content="dark light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Inspector">
<meta name="description" content="Find out what a YouTube video is really about before you watch it.">
<title>Tube Inspector</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="64x64" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main id="app">

  <!-- HOME -->
  <section id="v-home" class="view">
    <header class="topbar">
      <div class="brand">
        <img src="icons/logo.png" width="36" height="36" alt="" class="brand-logo">
        <span class="brand-name">Tube Inspector</span>
      </div>
      <button type="button" id="btn-settings" class="icon-btn" aria-label="Settings"></button>
    </header>

    <div id="setup-card" class="card setup" hidden>
      <strong>Connect your backend first</strong>
      <p>Tube Inspector needs the small backend (a free Cloudflare Worker) to read captions and talk to the AI. The README explains the five-minute setup.</p>
      <button type="button" id="btn-setup" class="btn btn-primary">Open settings</button>
    </div>

    <div class="hero">
      <h1>What is this video really about?</h1>
      <p class="sub">Paste a link. Get the point in seconds.</p>
    </div>

    <form id="form-url" class="stack" autocomplete="off" novalidate>
      <label for="url" class="field-label">YouTube link</label>
      <input id="url" class="input" type="url" inputmode="url" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="youtube.com/watch?v=...">
      <button type="button" id="btn-paste" class="btn btn-secondary"></button>
      <button type="submit" class="btn btn-primary btn-lg">Summarize</button>
    </form>

    <p id="tip-share" class="tip"></p>
    <p id="tip-install" class="tip" hidden></p>

    <div id="recent-wrap" hidden>
      <div class="row-between">
        <h2 class="h2">Recent</h2>
        <span class="muted small">Saved on this phone</span>
      </div>
      <div id="recent" class="stack tight"></div>
    </div>

    <p id="model-line" class="model-line"></p>
  </section>

  <!-- PROGRESS -->
  <section id="v-progress" class="view" hidden></section>

  <!-- NEEDS TRANSCRIPT -->
  <section id="v-transcript" class="view" hidden></section>

  <!-- RESULT -->
  <section id="v-result" class="view" hidden></section>

  <!-- ASK -->
  <section id="v-ask" class="view view-ask" hidden></section>

  <!-- SETTINGS -->
  <section id="v-settings" class="view" hidden></section>

</main>
<div id="toast" role="status" aria-live="polite"></div>
<noscript><p style="padding:24px;color:#fff">This app needs JavaScript.</p></noscript>
<script type="module" src="js/app.js"></script>
</body>
</html>
